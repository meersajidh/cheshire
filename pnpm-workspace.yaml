# One glob, because a package's directory basename is its name with the scope
# stripped — `@cheshire/runtime-electron` in `packages/runtime-electron`,
# unscoped `create-cheshire` in `packages/create-cheshire`. Stripping an absent
# scope is a no-op, so the rule has no exceptions and `scripts/check-layout.mjs`
# enforces it.
packages:
  - 'packages/*'

# templates/ is deliberately NOT a workspace package: template dependencies are
# resolved by create-cheshire inside the generated app, never installed here.
# (x-bb learned the harder version of this: examples/ on `workspace:*` resolved
# to framework SOURCE, so the one thing meant to prove the seam proved an
# arrangement no consumer could reproduce.)

# Single source of version truth for anything more than one package names.
# A manifest writes `"react": "catalog:"` and resolves from here.
catalog:
  typescript: ~6.0.2
  '@types/node': ^24.13.2
  react: ^19.2.7
  react-dom: ^19.2.7
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.3
  vite: ^8.1.1
  '@vitejs/plugin-react': ^6.0.3
  electron: 43.1.1
  electron-builder: ^26.8.1
  vitest: ^4.0.0

# Flat, real-dir node_modules — NOT pnpm's default isolated/symlinked linker.
#
# Here it mirrors the consumer environment and nothing more. Both reasons the
# setting is load-bearing are about a *generated application*: electron-builder
# not following Windows junctions when collecting binaries, and generated code
# in `.cheshire/` resolving `@cheshire/cli`'s dependencies. The template's own
# `pnpm-workspace.yaml` carries them, measured. This repository packages nothing
# and generates nothing into itself — the gate lives outside it — so neither
# applies here.
#
# Kept rather than removed because it costs nothing and matching the consumer
# is worth more than the alternative buys: `isolated` would catch a framework
# package importing what it does not declare, and there is nothing to catch.
# The only undeclared imports are `vitest` in test files, declared at the root
# and resolved by walking up — which `isolated` permits too.
nodeLinker: hoisted

# pnpm 10+ gates every dependency lifecycle script by default (supply-chain
# guard). pnpm 11.3+ reads this MAP, not the older `onlyBuiltDependencies`
# array — one explicit decision per build-script dependency.
#
# electron 43 declares NO postinstall: it ships `install.js` as a bin
# (`install-electron`) and the binary is fetched explicitly, not on install.
# The entry below is therefore inert today, and kept as the decision record —
# electron 41/42 did download on postinstall, and electron-builder and native
# modules will need entries here later.
allowBuilds:
  electron: true

# Supply-chain cooldown: refuse lockfile entries published inside this window
# (minutes; 4320 = 3 days). Committed here so CI and every machine enforce one
# policy rather than relying on per-machine global pnpm config.
minimumReleaseAge: 4320
